name: Build Persons DB

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download IMDb datasets
        run: |
          curl -L -o title.basics.tsv.gz https://datasets.imdbws.com/title.basics.tsv.gz
          curl -L -o title.principals.tsv.gz https://datasets.imdbws.com/title.principals.tsv.gz
          ls -lh *.gz

      - name: Build sharded persons
        run: |
          python build.py
          mkdir -p dist/persons
          cp -r persons/* dist/persons/
          cp version.json dist/
          echo "Shards built: $(find dist/persons -name '*.json' | wc -l)"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
