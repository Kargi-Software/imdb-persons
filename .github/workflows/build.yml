name: Build & Deploy IMDb Persons

on:
  workflow_dispatch:          دستی
  schedule:
    - cron: "0 4 * * 1"      

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build filmography
        run: |
          python build_filmography.py
          echo "=== Build output ==="
          ls -la
          echo "=== persons folder ==="
          ls -la persons/ | head -20
          find persons -type f | wc -l

      - name: Prepare publish folder
        run: |
          rm -rf publish
          mkdir -p publish
          # فقط محتویات persons را کپی می‌کنیم
          cp -r persons/* publish/
          # version.json را هم اگر وجود دارد کپی کن
          if [ -f version.json ]; then
            cp version.json publish/
          fi
          echo "=== publish folder ==="
          ls -la publish/
          find publish -type f | wc -l

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy filmography ${{ github.sha }}"
