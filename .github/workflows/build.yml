name: Build Persons DB

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download IMDb datasets
        run: |
          curl -L -o title.basics.tsv.gz https://datasets.imdbws.com/title.basics.tsv.gz
          curl -L -o title.principals.tsv.gz https://datasets.imdbws.com/title.principals.tsv.gz

      - name: Build
        run: python build.py

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir:./
          include: |
            persons/**/*
            version.json
