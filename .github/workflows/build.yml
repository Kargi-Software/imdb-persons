name: Build IMDb Filmography Shards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # هر دوشنبه ساعت ۴ صبح UTC

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache IMDb dumps
        uses: actions/cache@v4
        with:
          path: cache
          key: imdb-dumps-${{ github.run_id }}
          restore-keys: |
            imdb-dumps-

      - name: Build filmography
        run: python build_filmography.py

      - name: Show output stats
        run: |
          echo "=== version.json ==="
          cat version.json
          echo ""
          echo "=== total size ==="
          du -sh persons
          echo ""
          echo "=== largest files ==="
          find persons -name "*.json" -exec ls -lh {} + | sort -k5 -h | tail -10

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add persons/ version.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update filmography shards $(date -u +%Y-%m-%d)"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
